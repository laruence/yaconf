name: integrate
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  matrix:
    name: "Linux PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.0", "7.1", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    env:
      PHP: ${{ matrix.php }}
      GITHUB: "yes"
      enable_debug: "yes"
      enable_maintainer_zts: ${{ matrix.ts == 'ts' && 'yes' || 'no' }}
      enable_session: "yes"
      TEST_PHP_ARGS : "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install
        run: |
          sudo apt-get install -y re2c
      - name: Prepare
        run: |
            phpize
      - name: Build
        run: |
            ./configure
      - name: Make
        run: |
            make
      - name: Test
        run: |
            make test

  windows:
    name: "Windows PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["7.2", "8.0", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
          # tests 020-022 spawn a local php server on fixed port 8965, so
          # parallel workers collide; tests must run serially
          test-workers: 1
