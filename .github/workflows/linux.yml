name: linux
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux:
    name: "Linux PHP ${{ matrix.php }} (${{ matrix.ts }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.0", "7.1", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        ts: ["nts"]
        include:
          - php: "8.5"
            ts: "ts"
    env:
      PHP: ${{ matrix.php }}
      GITHUB: "yes"
      enable_debug: "yes"
      enable_maintainer_zts: ${{ matrix.ts == 'ts' && 'yes' || 'no' }}
      enable_session: "yes"
      TEST_PHP_ARGS : "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install
        run: |
          sudo apt-get install -y re2c
      - name: Prepare
        run: |
            phpize
      - name: Build
        run: |
            ./configure
      - name: Make
        run: |
            make
      - name: Test
        run: |
            TEST_PHP_JOBS=$(nproc) make test

  yaml:
    name: "Linux PHP 8.5 (nts, YAML)"
    runs-on: ubuntu-latest
    env:
      GITHUB: "yes"
      TEST_PHP_ARGS: "--show-diff"
      REPORT_EXIT_STATUS: "yes"
      NO_INTERACTION: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c libyaml-dev
      - name: Build with libyaml
        run: |
          phpize
          ./configure --with-yaml
          make
      - name: Test YAML build
        run: |
          TEST_PHP_JOBS=$(nproc) make test
      - name: Smoke test explicit libyaml prefix
        run: |
          prefix=/tmp/yaconf-libyaml-prefix
          mkdir -p "$prefix/include" "$prefix/lib" /tmp/yaconf-prefix-build
          ln -s "$(pkg-config --variable=includedir yaml-0.1)/yaml.h" "$prefix/include/yaml.h"
          ln -s "$(pkg-config --variable=libdir yaml-0.1)/libyaml.so" "$prefix/lib/libyaml.so"
          git archive --format=tar HEAD | tar -xf - -C /tmp/yaconf-prefix-build
          cd /tmp/yaconf-prefix-build
          phpize
          ./configure --with-yaml="$prefix"
          make
          php -n -d "extension=$PWD/modules/yaconf.so" -r 'exit(YACONF_HAVE_YAML ? 0 : 1);'
